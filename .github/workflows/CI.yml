# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [master]
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "CI"
  CI:
    # The type of runners that the job will run on
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-26.04,
            ubuntu-24.04,
            ubuntu-22.04,
            windows-2025-vs2026,
            windows-2025,
            windows-2022
          ]
        method: [local, network]
        oneapi: [2026.1.1]
    runs-on: ${{ matrix.os }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

      - name: Run the action on this runner with method ${{matrix.method}}
        id: test-action
        uses: ./
        with:
          oneapi: ${{ matrix.oneapi }}
          method: ${{matrix.method}}
          log-file-suffix: '${{matrix.method}}-${{matrix.os}}'

      - name: Run the action on this runner with compiler and mkl subpackages (Linux)
        if: runner.os == 'Linux' && matrix.method == 'network'
        uses: ./
        with:
          method: ${{matrix.method}}
          sub-packages: '["compiler-dpcpp-cpp"]'
          non-oneapi-sub-packages: '["intel-oneapi-mkl"]'
          log-file-suffix: 'compiler-mkl-${{matrix.method}}-${{matrix.os}}'

      - name: Print output oneapi version
        run: echo "${{ steps.test-action.outputs.oneapi }}"

      - name: Print output paths
        run: |
          echo "ONEAPI_ROOT: ${{ steps.test-action.outputs.ONEAPI_ROOT }}"
          echo "ONEAPI_PATH: ${{ steps.test-action.outputs.ONEAPI_PATH }}"

      - name: List paths (windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ls $env:ONEAPI_ROOT
          ls $env:ONEAPI_ROOT\bin -ErrorAction SilentlyContinue

      - name: List paths (linux)
        if: runner.os == 'Linux'
        run: |
          ls -la $ONEAPI_ROOT
          ls -la $ONEAPI_ROOT/bin || true
