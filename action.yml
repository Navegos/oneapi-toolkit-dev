name: 'oneapi-toolkit-dev'
description: 'Installs Intel(R) oneAPI Toolkit and Intel(R) Deep Learning Essentials and adds to PATH'
author: '@DevelVitorF'
inputs:
  product:
    description: "Product to install: 'toolkit' (Intel oneAPI Toolkit) or 'deep-learning-essentials' (Intel Deep Learning Essentials)"
    required: false
    default: 'toolkit'
  oneapi:
    description: 'oneAPI or Deep Learning Essentials version (e.g. 2026.1.1, 2026.1.0, 2026.0.0, 2025.3.3)'
    required: false
    default: '2026.1.1'
  sub-packages:
    description: 'Only installs specified subpackages, must be in the form of a JSON array.'
    required: false
    default: '[]'
  non-oneapi-sub-packages:
    description:
      'Only installs specified subpackages that do not have the intel-oneapi prefix,
      must be in the form of a JSON array.'
    required: false
    default: '[]'
  method:
    description: "Installation method: 'local' (offline installer), 'network' (online installer/APT), or 'apt'."
    required: false
    default: 'local'
  linux-local-args:
    description: 'Arguments for the local installer in the form of a JSON array.'
    required: false
    default: '[]'
  use-github-cache:
    description: 'Use GitHub cache to cache downloaded installer on GitHub servers'
    required: false
    default: 'true'
  use-local-cache:
    description: 'Use local cache to cache downloaded installer on the local runner'
    required: false
    default: 'true'
  log-file-suffix:
    description: 'Suffix of log file name in artifact'
    required: false
    default: 'log.txt'
outputs:
  ONEAPI_ROOT:
    description: 'Path to Intel oneAPI installation root'
  ONEAPI_PATH:
    description: 'Path to Intel oneAPI installation root'
  oneapi:
    description: 'Version of oneAPI installed'
runs:
  using: 'node24'
  main: dist/index.js
branding:
  icon: box
  color: blue
